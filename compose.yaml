services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      READ_ONLY_DEMO: "${READ_ONLY_DEMO:-true}"
      DATABASE_PATH: /app/data/curriculum.sqlite3
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
    volumes:
      - curriculum-data:/app/data
    restart: unless-stopped
volumes:
  curriculum-data:
