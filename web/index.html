<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Data-Driven Curriculum — аналитика результатов по темам, сравнение учебников и план учебных часов для методиста." />
    <meta name="theme-color" content="#0a0a14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Data-Driven Curriculum</title>
    <script>
      // Тёмная тема по умолчанию; светлая — по кнопке (выбор запоминается).
      try {
        var t = localStorage.getItem('ddc.theme3');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
