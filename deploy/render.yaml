# PREPARED ONLY. Creating this Blueprint creates BILLABLE resources.
# Do not apply before P0 + team review + the owner's budget approval.
services:
  - type: web
    name: data-driven-curriculum
    runtime: docker
    repo: https://github.com/bekzatwr/data-driven-curriculum
    branch: feature/bekzat-p1-infrastructure
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: curriculum-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: APP_TARGET
        value: fullstack
      - key: FRONTEND_DIR
        value: web
      - key: VITE_API_BASE_URL
        value: ""
      - key: PORT
        value: "8000"
      - key: DATABASE_PATH
        value: /app/data/curriculum.sqlite3
      - key: DATA_MOUNT_PATH
        value: /app/data
      - key: REQUIRE_PERSISTENT_STORAGE
        value: "true"
      - key: REQUIRE_P0
        value: "true"
      - key: READ_ONLY_DEMO
        value: "true"
      - key: PUBLIC_DEMO
        value: "true"
      - key: CORS_ORIGINS
        value: ""
      # Uvicorn does not rewrite the TCP peer. Populate only after proxy verification.
      - key: TRUSTED_PROXY_CIDRS
        value: ""
      - key: P1_COMMENTS_ENABLED
        value: "true"
      - key: AI_ENABLED
        value: "false"
      - key: AI_ACCOUNT_VERIFIED
        value: "false"
      - key: AI_PROVIDERS
        value: groq,gemini
      # No AI secrets required for the read-only public demo. Add runtime-only keys
      # to an approved PRIVATE environment after account/model verification.
