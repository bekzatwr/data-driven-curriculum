name: Backend checks
on:
  push:
    branches: [main, backend/bekzat, analytics/toni, 'integration/**', 'deployment/**', 'feature/bekzat-*', feature/aidana-period-planner, 'fix/damir-*']
  pull_request:
    branches: [main, 'integration/**', feature/bekzat-p1-infrastructure, deployment/bekzat-cloud-readiness]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/export_contracts.py
      - run: git diff --exit-code -- contracts
      - run: python scripts/benchmark_import.py --max-seconds 10
      - run: python scripts/benchmark_pipeline.py
      - run: python scripts/benchmark_teachers.py --http --repeats 1 --max-seconds 10
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 90
      - run: mkdir -p data && docker compose exec -T backend python deploy/seed_demo_report.py > data/demo-report.json
      - run: python scripts/smoke_container.py
      - run: docker compose exec -T backend python -m backend.app.db.backup --output /app/data/backups/ci.sqlite3
      - run: docker compose exec -T backend python -m backend.app.db.backup --source /app/data/backups/ci.sqlite3 --output /app/data/recovery.sqlite3
      - run: docker compose restart backend
      - run: python scripts/smoke_container.py --expect-existing
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
  deployment-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_deployment.py
      - if: failure()
        run: python -c "from pathlib import Path; [print(p.read_text()[-20000:]) for p in Path('data/deployment-checks').glob('*/docker.log')]"
