name: Backend checks
on:
  push:
    branches: [main, backend/bekzat]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/benchmark_import.py --max-seconds 10
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 90
      - run: python scripts/smoke_container.py
      - run: docker compose restart backend
      - run: python scripts/smoke_container.py --expect-existing
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
