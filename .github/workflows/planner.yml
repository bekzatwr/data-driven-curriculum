name: Planner checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-planner.txt
      - run: python -m unittest discover -s tests -v
